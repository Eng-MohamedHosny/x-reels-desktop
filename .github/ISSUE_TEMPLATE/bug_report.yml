name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 131 on Windows 11
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: X Reels Desktop version
      placeholder: "1.0.0"
  - type: textarea
    id: shots
    attributes:
      label: Screenshots or a short recording
      description: Drag files here. They help a lot.
