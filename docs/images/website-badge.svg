<svg xmlns="http://www.w3.org/2000/svg" width="236" height="68" viewBox="0 0 236 68" fill="none" role="img" aria-label="Visit the Live Website">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d1d1f"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="orb" x1="16" y1="14" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#48b3ff"/>
      <stop offset="50%" stop-color="#1d9bf0"/>
      <stop offset="100%" stop-color="#0071e3"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Apple App Store style pill card -->
  <rect x="1" y="1" width="234" height="66" rx="16" fill="url(#bg)" stroke="url(#rim)" stroke-width="1.5"/>

  <!-- Left glowing X-Blue globe icon -->
  <rect x="14" y="14" width="40" height="40" rx="11" fill="url(#orb)"/>
  <g stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="34" cy="34" r="11" fill="none"/>
    <ellipse cx="34" cy="34" rx="5.2" ry="11" fill="none"/>
    <path d="M23.5 34h21"/>
    <path d="M25.4 28.2h17.2"/>
    <path d="M25.4 39.8h17.2"/>
  </g>

  <!-- Apple-style two-line typography -->
  <text x="67" y="27" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="500" letter-spacing="0.01em">Visit the</text>
  <text x="66.5" y="48" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, sans-serif" font-size="21" font-weight="700" letter-spacing="-0.025em">Live Website</text>

  <!-- Crisp right chevron -->
  <path d="M210 28.5 L215.5 34 L210 39.5" stroke="#5cc1ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
